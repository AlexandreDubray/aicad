[package]
name = "aicad"
version = "1.0.0-rc.1"
edition = "2024"
rust-version = "1.95"
description = "A library to solve Constraint satisfaction problems with Multi-valued decision diagrams and, optionnaly, neural networks"
license = "MIT"
repository = "https://github.com/AlexandreDubray/aicad"
documentation = "https://docs.rs/aicad"
homepage = "https://alexandredubray.github.io/aicad/"
readme = "README.md"
keywords = ["constraint programming", "multi-valued decision diagrams", "constraints", "neural-networks"]
categories = ["algorithms", "science", "mathematics"]
exclude = [".github/", ".githooks/", "docs/", "scripts/", "python/", "pyproject.toml", "CONTRIBUTING.md"]
crate-type = ["cdylib", "rlib"]

[dependencies]
rustc-hash = "2.1"
pyo3 = { version = "0.28", features = ["num-bigint"], optional = true }
num-bigint = "0.4"
rayon = "1"
rand = "0.10"
rand_xoshiro = "0.8"
deepsize = "0.2.0"
# need to deactivate op-fusion due to a bug in cubecl resulting in invalid memory access
#burn = { version = "~0.21", features = ["train", "ndarray", "cuda"] }
burn = { version = "~0.21", default-features = false, features = ["train", "ndarray", "cuda", "std", "autotune"], optional = true }
serde = "1.0"
serde_json = "1.0"
log = "0.4"
pyo3-log = { version = "0.13", optional = true }
dyn-clone = ">=0.1"
indicatif = { version = "0.18", features = ["rayon"] }

[features]
default = []
# Training and the neural searches: pulls in burn, which is heavy to build. The MDD compiler,
# sampling, belief propagation and the belief-propagation local search do not need it.
learning = ["dep:burn"]
# The Python bindings (the `pyaicad` package). Built by maturin, never needed from Rust. Combine
# with `learning` for the training and the neural searches; without it the bindings stop at the
# compiler, sampling and belief propagation.
python = ["dep:pyo3", "dep:pyo3-log", "pyo3/extension-module"]

[package.metadata.docs.rs]
# The learning modules are documented too, although docs.rs has no GPU: it only builds the docs.
features = ["learning"]
rustdoc-args = [ "--html-in-header", "katex-header.html" ]
