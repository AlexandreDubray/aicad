name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95.0"
          components: rustfmt
      - run: cargo fmt --all --check

  layering:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/check_layering.py

  clippy:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # The lightest build (no burn), the build with training, and the Python bindings.
        features: ["", "--features learning", "--features python"]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95.0"
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets ${{ matrix.features }} -- -D warnings

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        features: ["", "--features learning"]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95.0"
      - uses: Swatinem/rust-cache@v2
      - run: cargo test ${{ matrix.features }}

  # The public docs (what docs.rs shows), then everything for contributors, private items
  # included. Both must build without a warning, broken links included.
  doc:
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: "-D warnings"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95.0"
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --no-deps
      - run: cargo doc --no-deps --features learning --document-private-items

  # The Python package in both builds: the slim wheel (no burn) must work and refuse learning
  # clearly, the full wheel runs everything. The user guide executes its examples, so building
  # it with -W is also the test that the guide matches the library.
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: slim
            features: python
          - name: full
            features: python,learning
    name: python (${{ matrix.name }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95.0"
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.name }}
      - run: python -m venv .venv && .venv/bin/pip install maturin -r requirements.txt
      - run: .venv/bin/maturin develop --release --features ${{ matrix.features }}
        env:
          VIRTUAL_ENV: ${{ github.workspace }}/.venv
      - run: .venv/bin/python -m pytest -q -rs
      - name: Build the user guide
        if: matrix.name == 'full'
        run: |
          .venv/bin/pip install -r docs/requirements.txt
          .venv/bin/python -m sphinx -b html -W --keep-going docs docs/_build

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95.0"
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-llvm-cov
      - name: Line coverage summary
        run: |
          cargo llvm-cov --features learning --summary-only | tee coverage.txt
          { echo '```'; cat coverage.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
