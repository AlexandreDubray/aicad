[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "pyaicad"
version = "0.0.1"
description = "MDD compilation for constraint satisfaction and search strategies built on it"
requires-python = ">=3.8"
dependencies = []

[project.optional-dependencies]
# Building models from CPMpy expressions is done by the scripts that need it; the library itself
# does not depend on it.
cpmpy = ["cpmpy>=0.9.0"]
test = ["pytest>=7"]

[tool.maturin]
python-source = "python"
module-name = "pyaicad._core"
features = ["pyo3/extension-module"]

[tool.pytest.ini_options]
testpaths = ["tests", "python/pyaicad"]
addopts = "--doctest-modules"
