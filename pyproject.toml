[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "pyaicad"
version = "0.0.1"
description = "MDD compilation for constraint satisfaction and search strategies built on it"
requires-python = ">=3.8"
dependencies = []

[project.optional-dependencies]
# Building models from CPMpy expressions is done by the scripts that need it; the library itself
# does not depend on it.
cpmpy = ["cpmpy>=0.9.0"]
test = ["pytest>=7"]
# The Python guide executes its examples, so building it needs the full build for the training chapter.
docs = ["sphinx>=7", "furo", "myst-nb>=1", "sphinx-copybutton"]

[tool.maturin]
python-source = "python"
module-name = "pyaicad._core"
# The compiler, sampling and the belief-propagation search. Training and the neural searches are
# the `learning` feature, which pulls in burn and is heavy to build: add it with
# `maturin develop --features python,learning` (or `maturin build --release --features python,learning`).
# A `--features` on the command line replaces this list rather than extending it, so keep `python`.
features = ["python"]

[tool.pytest.ini_options]
testpaths = ["tests", "python/pyaicad"]
addopts = "--doctest-modules"
